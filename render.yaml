services:
  - type: web
    name: civic-pulse-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: "on"
    disk:
      name: civic-pulse-data
      mountPath: /var/data/civic-pulse
      sizeGB: 1
    envVars:
      - key: CIVIC_DB_PATH
        value: /var/data/civic-pulse/civic_pulse.db
      - key: CORS_ORIGINS
        sync: false
      - key: RESET_URL_BASE
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: Initial Super Administrator

  - type: web
    name: civic-pulse-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    autoDeployTrigger: "on"
    envVars:
      - key: VITE_API_BASE
        value: https://civic-pulse-360.onrender.com/api
